<!DOCTYPE html>
<!-- Version: 1762039783114 - GitHub Pages Direct AR -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DModel_LowPoly - 3D Model</title>
    <link rel="stylesheet" href="../../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div style="background: #0f172a; color: white; font-family: Inter, sans-serif; min-height: 100vh;">
        <header style="padding: 1rem; text-align: center; border-bottom: 1px solid #1e293b;">
            <h1 style="margin: 0; font-size: 1.5rem;">🎯 3DModel_LowPoly</h1>
            
        </header>
        <main style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
            <div style="background: #1e293b; border-radius: 1rem; padding: 1rem; margin-bottom: 2rem;">
                <model-viewer 
                    src="https://imagniahf-design.github.io/model-showcase-pages/models/model_1759151188342_f8wdl2l7h/model.glb"
                    alt="3DModel_LowPoly"
                    ar 
                    ar-modes="scene-viewer webxr" 
                    camera-controls 
                    auto-rotate 
                    environment-image="neutral" 
                    poster="https://imagniahf-design.github.io/model-showcase-pages/models/model_1759151188342_f8wdl2l7h/poster.jpg"
                    ar-placement="floor"
                    ar-scale="auto"
                    style="width: 100%; height: 500px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
                    <button slot="ar-button" style="position:absolute; bottom:16px; left:50%; transform:translateX(-50%); padding:12px 24px; font-size:16px; font-weight:bold; background:#000; color:#fff; border:none; border-radius:8px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.2);">START AR</button>
                </model-viewer>
            </div>
        </main>
    </div>
        <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
        <script>
        // iOS Quick Look - NO intermediate pages, NO lag
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        // Preload USDZ on iOS for instant AR
        if (isIOS) {
            const usdzUrl = '';
            if (usdzUrl) {
                const link = document.createElement('link');
                link.rel = 'prefetch';
                link.href = usdzUrl;
                link.as = 'fetch';
                document.head.appendChild(link);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const iosArLink = document.querySelector('#ios-ar-link');
            
            if (iosArLink) {
                // Show AR button on ALL devices
                iosArLink.style.display = 'inline-block';
                
                if (isIOS) {
                    // iOS: Multiple event handlers for reliability
                    const launchAR = function(e) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        
                        const url = iosArLink.href;
                        
                        // Create a hidden anchor and click it (Apple's recommended method)
                        const tempAnchor = document.createElement('a');
                        tempAnchor.href = url;
                        tempAnchor.rel = 'ar';
                        tempAnchor.style.display = 'none';
                        document.body.appendChild(tempAnchor);
                        tempAnchor.click();
                        setTimeout(() => document.body.removeChild(tempAnchor), 100);
                        
                        return false;
                    };
                    
                    iosArLink.addEventListener('click', launchAR, { capture: true, passive: false });
                    iosArLink.addEventListener('touchstart', launchAR, { capture: true, passive: false });
                }
            }
        });
    </script>
</body>
</html>
